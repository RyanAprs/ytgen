# ---- Video ----
resolution: "1080p"        # 720p | 1080p
aspect: "16:9"             # 16:9 (long-form) | 9:16 (shorts)
fps: 30

# ---- Script / LLM ----
llm:
  provider: "groq"         # groq | openai | ollama
  model: "openai/gpt-oss-20b"
  target_duration_sec: 180 # ~3 min video
  # words-per-minute for narration (used to size script to duration)
  wpm: 150

# ---- Research ----
research:
  enabled: true
  max_sources: 6

# ---- Voice (Edge-TTS) ----
tts:
  voice: "en-US-AriaNeural"
  rate: "+0%"
  pitch: "+0Hz"

# ---- Captions ----
captions:
  enabled: true
  font: "Arial"
  font_size: 42
  max_words: 4
  primary_color: "&H00FFFFFF"   # white (ASS BGR)
  outline: 3

# ---- Music ----
music:
  enabled: true
  provider: "jamendo"             # "jamendo" (real instrumental via API) | "local" (files in dir)
  mood: "cinematic"
  volume: 0.12                    # ducked under voice (melodic music sits lower than drone)
  dir: "assets/music"

# ---- Visuals ----
visuals:
  sources: ["pexels", "pixabay"]
  ken_burns: true

# ---- Bilibili (Chinese metadata for cross-posting) ----
bilibili:
  enabled: true                   # also emit Chinese title/desc/tags -> output/bilibili_zh.txt + .json
  tid: 228                        # 知识 → 人文历史 (Humanities & History). See skill for other tids.
  copyright: 2                    # 1=自制/original, 2=转载/reprint (use 2 for stock footage + Jamendo music)


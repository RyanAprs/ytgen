[project]
name = "yt-video-generator"
version = "0.1.0"
description = "Faceless YouTube video generator: topic in -> mp4 out"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "requests>=2.31",
    "ddgs>=6.0",
    "trafilatura>=1.8",
    "edge-tts>=6.1",
    "pillow>=10.0",
]

[project.scripts]
ytgen = "ytgen.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ytgen"]
